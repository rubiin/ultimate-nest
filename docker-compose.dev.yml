# Local development stack, as described in docs/getting-started.md.
#
#   cp env/.env.dev.sample env/.env.dev
#   docker compose -f docker-compose.dev.yml up --build
#
# The `app` service builds, waits for Postgres, migrates, seeds and then serves, so one
# command replaces steps 3 and 4 of the guide. `SEED_ON_START=auto` seeds only on the boot
# that first migrates the database, because the seeders are not idempotent.
#
# Every port is still published and the sample credentials still match, so you can keep
# running the app on the host (`NODE_ENV=dev pnpm start:dev`) instead by starting only the
# backing services:
#
#   docker compose -f docker-compose.dev.yml up -d --wait database redis rabbitmq mailpit
#
# For the production-style stack (Traefik, TLS, pgAdmin) see docker-compose.yml.

services:
  app:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    container_name: nestify-app
    restart: unless-stopped
    # Inside the compose network the app reaches the services by service name, not localhost.
    environment:
      NODE_ENV: dev
      DB_HOST: database
      REDIS_HOST: redis
      RABBITMQ_URI: amqp://nestify:secret@rabbitmq:5672
      MAIL_HOST: mailpit
      USER_PASSWORD: ${USER_PASSWORD:-Test@1234}
      # `auto` seeds only on the boot that first migrates the database. The seeders are not
      # idempotent, so a forced `always` on a populated database fails on a duplicate email.
      SEED_ON_START: ${SEED_ON_START:-auto}
    env_file:
      - env/.env.${DEPLOY_ENV:-dev}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      # env/ holds the generated, gitignored env files the config module reads at boot.
      - ./env:/usr/src/app/env
      # Keep the image's node_modules; an anonymous volume hides the host's Linux-incompatible ones.
      - /usr/src/app/node_modules
    entrypoint: ["/bin/sh", "docker/entrypoint.sh"]

  database:
    image: postgres:15.3-alpine
    container_name: nestify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nestify
      POSTGRES_PASSWORD: nestify
      POSTGRES_DB: nestify
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestify -d nestify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0.11-alpine
    container_name: nestify-redis
    restart: unless-stopped
    # `requirepass` provisions the built-in `default` ACL user, so the username
    # in REDIS_USERNAME is literally "default".
    command: redis-server --requirepass redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a redis ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12.0-management-alpine
    container_name: nestify-rabbit
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: nestify
      RABBITMQ_DEFAULT_PASS: secret
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/mnesia/
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: nestify-mail
    restart: unless-stopped
    ports:
      # 1025 SMTP, 8025 web UI
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

# Production-style stack. It expects a filled-in production env file, e.g.
#   DEPLOY_ENV=production docker compose -f docker-compose.yml up --build -d
# The env file must set DB_USERNAME, DB_PASSWORD, DB_DATABASE, REDIS_PASSWORD,
# RABBITMQ_PASSWORD, API_URL and JWT_SECRET. No backing service is published on the
# host; only Traefik publishes 80/443.

services:
  app:
    container_name: nestify
    env_file: env/.env.${DEPLOY_ENV:?set DEPLOY_ENV}
    build:
      context: .
      dockerfile: ./docker/prod.Dockerfile
    image: nestify:prod
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: database
      REDIS_HOST: redis
      RABBITMQ_URI: amqp://nestify:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672
    read_only: true
    tmpfs:
      - /app/logs
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.nestify.rule=Host(`${API_URL:?set API_URL}`)
      - traefik.http.services.nestify.loadbalancer.server.port=3000
      - traefik.http.routers.nestify.entrypoints=websecure
      - traefik.http.routers.nestify.tls=true
      - traefik.http.routers.nestify.tls.certresolver=myresolver
    expose:
      - 3000
    networks:
      - nestify-network

  traefik:
    image: traefik:v2.11.61
    container_name: traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --accesslog
      - --log
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.myresolver.acme.tlschallenge=true
      - --certificatesresolvers.myresolver.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
    networks:
      - nestify-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  redis:
    container_name: redis
    image: redis:8.10.3-alpine
    restart: unless-stopped
    command: redis-server --loglevel warning --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    networks:
      - nestify-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.4.0-management-alpine
    networks:
      - nestify-network
    environment:
      - RABBITMQ_DEFAULT_USER=nestify
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/mnesia/
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  database:
    container_name: database
    image: postgres:18.6-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${DB_USERNAME:?set DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE:?set DB_DATABASE}
    networks:
      - nestify-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
  rabbitmq-data:
  postgres_data:
  letsencrypt:

networks:
  nestify-network:
    name: nestify-network

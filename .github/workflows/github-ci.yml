name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.0
          cache: pnpm

      - run: pnpm install --shamefully-hoist
      - run: pnpm build
      # Without this a green CI only proved the code type-checks: 96 spec files, none of them run.
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nestify
          POSTGRES_PASSWORD: nestify
          POSTGRES_DB: nestify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        options: >-
          --requirepass redis
          --health-cmd "redis-cli -a redis ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: nestify
          RABBITMQ_DEFAULT_PASS: secret
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.0
          cache: pnpm

      - run: pnpm install --shamefully-hoist
      - run: pnpm build
      # The e2e suite talks to a running app on APP_URL, so point it at 8000.
      - run: cp env/.env.sample env/.env.test
      - run: sed -i "s|^APP_PORT=.*|APP_PORT=8000|" env/.env.test
      - run: NODE_ENV=test pnpm orm migration:up
      - run: NODE_ENV=test USER_PASSWORD=Test@1234 pnpm orm seeder:run
      - run: NODE_ENV=test node dist/main &
      - name: Wait for the app
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/v1/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "app did not become healthy" >&2
          exit 1
      - run: NODE_ENV=test pnpm test:e2e

  release:
    if: ${{ github.ref == 'refs/heads/master' }}
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node
          package-name: ultimate-nest
      - uses: actions/checkout@v7
      - name: tag stable versions
        if: ${{ steps.release.outputs.release_created }}
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git remote add gh-token "https://${{ secrets.TOKEN_GITHUB }}@github.com/google-github-actions/release-please-action.git"
          git tag -d stable || true
          git push origin :stable || true
          git tag -a stable -m "Last Stable Release"
          git push origin stable
